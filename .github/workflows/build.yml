name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  # 배포물만 따로 뽑고 싶을 때: Actions → build → Run workflow.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # 코어 워크스페이스 (sb-* 크레이트) — 3-OS 테스트 + fmt + clippy.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # arboard(Linux) 빌드 의존성.
      - name: Linux 시스템 의존성
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libwayland-dev
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets
      - name: test
        run: cargo test --workspace
      # Wayland 백엔드는 Linux 전용·기본 off — Docker(ubuntu:24.04, wl-clipboard-rs 0.9.3)로 검증됨.
      - name: Wayland 백엔드 컴파일 (Linux)
        if: runner.os == 'Linux'
        run: cargo build -p sb-clipboard --features wayland-backend

  # 서버 바이너리 — glibc 하한을 러너 라벨과 분리(ubuntu:22.04 컨테이너, §13.4/R10).
  server-build:
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    steps:
      - uses: actions/checkout@v4
      - name: 빌드 도구
        run: |
          apt-get update
          apt-get install -y curl build-essential pkg-config
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - name: sb-server 릴리스 빌드
        run: cargo build -p sb-server --release
      - uses: actions/upload-artifact@v4
        with:
          name: sb-server-linux
          path: target/release/sb-server

  # 프런트엔드 빌드.
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  # 데스크톱 앱 컴파일 체크 (번들링 제외 — 서명 필요).
  app-check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux Tauri 의존성
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: cargo check (src-tauri)
        working-directory: src-tauri
        run: cargo check

  # Windows 배포물 — 설치 파일(NSIS .exe) + MSI + 포터블 exe + sb-server.exe.
  # PR 에서는 건너뛴다(release LTO 빌드가 무겁다). 필요하면 workflow_dispatch 로 수동 실행.
  # 산출물: Actions 실행 페이지 → Artifacts → shareboard-windows-x64.
  # v* 태그를 푸시하면 같은 파일들이 GitHub Release 에 첨부된다.
  windows-bundle:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    permissions:
      contents: write # 태그 푸시 시 릴리스 생성·업로드
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          # 코어 워크스페이스(sb-server) + 앱 워크스페이스(src-tauri) 둘 다 캐시.
          workspaces: |
            .
            src-tauri
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 번들 빌드 (설치 파일 + 포터블 exe + 서버)
        shell: pwsh
        run: ./scripts/build-windows.ps1 -SkipInstall
      - uses: actions/upload-artifact@v4
        with:
          name: shareboard-windows-x64
          path: release/*
          if-no-files-found: error
      - name: GitHub Release 첨부 (v* 태그 푸시)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = (Get-ChildItem release -File).FullName
          gh release view $env:GITHUB_REF_NAME 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:GITHUB_REF_NAME --title $env:GITHUB_REF_NAME --generate-notes
            if ($LASTEXITCODE -ne 0) { throw '릴리스 생성 실패' }
          }
          gh release upload $env:GITHUB_REF_NAME @files --clobber
          if ($LASTEXITCODE -ne 0) { throw '릴리스 업로드 실패' }

  # 공급망 게이트 (§13.2) — cargo-deny(라이선스·advisory).
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources
