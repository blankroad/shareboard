[workspace]
resolver = "2"
members = [
    "crates/sb-proto",
    "crates/sb-crypto",
    "crates/sb-core",
    "crates/sb-net",
    "crates/sb-server",
    "crates/sb-store",
    "crates/sb-clipboard",
]
# Tauri 앱은 무거운 GUI 의존성 때문에 코어 워크스페이스에서 분리(자체 Cargo.lock).
exclude = ["src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT OR Apache-2.0"
authors = ["shareboard"]
repository = ""

# 공유 의존성 버전 — PLAN.md §10 크레이트 목록 기준.
# 각 크레이트는 { workspace = true } 로 참조한다.
[workspace.dependencies]
# 직렬화 / 인코딩
serde = { version = "1", features = ["derive"] }
ciborium = "0.2"
serde_json = "1"

# 에러 / 유틸
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
toml = "0.8"

# 암호 (sb-crypto 이후 단계)
blake3 = "1"
sha2 = "0.10"
hkdf = "0.12"
hmac = "0.12"
chacha20poly1305 = "0.10"
argon2 = "0.5"
zeroize = { version = "1", features = ["derive"] }
rand = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
rcgen = "0.13"

# 비동기 / 네트워크 (sb-net / sb-server 단계)
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
bytes = "1"
zstd = "0.13"
futures = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
dirs = "5"
arboard = "3.4"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
