# cargo-deny 공급망 게이트 (§13.2). GPL 계열은 allow 목록에 없어 자동 거부된다(§D20).
[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    # Boost — MIT급 허용 라이선스(귀속 표시 의무 없음). Windows 클립보드 경로
    # (arboard → clipboard-win → error-code)에서 들어온다.
    "BSL-1.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "OpenSSL",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
# uniclipboard(AGPL) 코드 복사 금지·GPL 크레이트 회피 방침을 라이선스 allow 목록으로 강제.

[sources]
unknown-registry = "deny"
unknown-git = "deny"
